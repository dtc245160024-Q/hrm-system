version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hrm_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hrm_db
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hrm_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: postgres
      UPLOAD_LIMIT: 300M
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hrm_backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=hrm_db
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hrm_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: hrm_prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: hrm_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: hrm_nginx
    ports:
      - "80:80"
    restart: unless-stopped
