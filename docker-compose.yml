version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hrm_postgres
    restart: always
    environment:
      POSTGRES_USER: hrm_admin
      POSTGRES_PASSWORD: hrm_password_secure_123
      POSTGRES_DB: hrm_db
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    networks:
      - hrm_network

  backend:
    build: ./backend
    container_name: hrm_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_USER=hrm_admin
      - DB_PASSWORD=hrm_password_secure_123
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hrm_db
    depends_on:
      - db
    networks:
      - hrm_network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: hrm_frontend
    restart: always
    ports:
      - "5173:5173"
    networks:
      - hrm_network
    volumes:
      - ./frontend:/app

networks:
  hrm_network:
    driver: bridge
